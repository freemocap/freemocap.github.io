StylesPath = .vale/styles
MinAlertLevel = warning

Vocab = FreeMoCap

Packages = Google

[*.{md,mdx}]
BasedOnStyles = Vale, Google, FreeMoCap
# Google.Headings lives in the gitignored, vale-sync-managed .vale/styles/Google/
# directory, so project exceptions added to it don't persist and CI's vale-action
# never sees them (it manages its own separate copy). FreeMoCap.Headings.yml is
# a tracked copy of the same rule with those exceptions, so disable the original
# to avoid double-reporting the same headings.
Google.Headings = NO

# Google's passive-voice and wordiness rules produce noise in generated
# reference pages, where the phrasing comes from docstrings.
[reference/data-arrays.md]
BasedOnStyles = Vale, FreeMoCap

[reference/skeleton-models.md]
BasedOnStyles = Vale, FreeMoCap

# These five pages' frontmatter `title:` fields intentionally match their
# real sidebar labels (src/data/sitePages.ts), which use each term's actual
# branded/proper capitalization (WebSocket, Keypoint, Backend, Frontend,
# Triangulation) rather than this project's own body-prose house style
# (websocket, keypoint, backend, frontend, triangulation lowercase
# mid-sentence). Vale.Terms has no sentence-position awareness and no
# project-editable exceptions list (it's a Vale core style, not one of ours),
# so it flags the title field itself with no way to fix it without either
# breaking the title/sidebar match or reverting to a visibly wrong browser
# tab title. Scoped to just these five files rather than disabled globally.
[docs/reference/websocket-api.md]
Vale.Terms = NO

[docs/reference/skeleton-models.md]
Vale.Terms = NO

[concepts/triangulation.md]
Vale.Terms = NO

[build-docs/backend.md]
Vale.Terms = NO

[build-docs/frontend.md]
Vale.Terms = NO
